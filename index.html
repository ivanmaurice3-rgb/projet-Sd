<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memento - Version Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Tracking des versions</h1>
            <p>
                Suivi des versions des services et identification des services
                nécessitant une mise à jour.
            </p>
        </header>

        <section class="counters">

            <button class="counter active" data-filter="all">
                <span id="count-all">0</span>
                <strong>Total</strong>
            </button>

            <button class="counter deploy-counter" data-filter="deploy">
                <span id="count-deploy">0</span>
                <strong>À déployer</strong>
            </button>

            <button class="counter update-counter" data-filter="up-to-date">
                <span id="count-up-to-date">0</span>
                <strong>À jour</strong>
            </button>

        </section>

        <section id="services-view">

            <h2>Services</h2>

            <table>
                <thead>
                    <tr>
                        <th>Service</th>
                        <th>Version en production</th>
                        <th>Dernière version disponible</th>
                        <th>Statut</th>
                    </tr>
                </thead>

                <tbody id="services-table">
                </tbody>
            </table>

        </section>

        <section id="detail-view" class="hidden">

            <button id="back-button">
                ← Retour aux services
            </button>

            <div id="service-detail">
            </div>

        </section>

    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>

</body>

</html>
